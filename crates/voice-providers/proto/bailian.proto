// DashScope GAX 消息子集（手写最小集，对应阿里百炼 ASR/TTS 实时双向流）
//
// 这是基于 DashScope 文档 / 抓包分析的最小可用子集，用于 ASR（Paraformer-realtime-v2）
// 和 TTS（CosyVoice-v2）的请求/响应消息。后续如需扩展更多字段，按需追加即可。
//
// 包名：`bailian_providers` 与 voice-providers crate 同名空间，保持隔离。

syntax = "proto3";

package bailian_providers;

// ===== ASR =====

// ASR 会话开启请求（客户端 → 服务端）
message AsrOpenRequest {
    string model = 1;                              // 例如 "paraformer-realtime-v2"
    string format = 2;                             // 音频格式：pcm / wav / opus ...
    uint32 sample_rate = 3;                        // 例如 16000
    uint32 channels = 4;                           // 例如 1
    bool enable_intermediate_result = 5;           // 是否开启中间结果
    bool enable_punctuation = 6;                   // 是否加标点
}

// ASR 会话开启响应（服务端 → 客户端）
message AsrOpenResponse {
    string task_id = 1;                            // 服务端分配的 task_id
    string request_id = 2;
}

// ASR 音频分片请求（客户端 → 服务端），payload 携带原始 PCM 字节
message AsrAudioChunk {
    bytes payload = 1;
}

// ASR 结束请求（客户端 → 服务端）
message AsrStop {}

// ASR 转写结果（服务端 → 客户端），中间结果与最终结果共用此消息
message AsrTranscript {
    string text = 1;
    bool is_final = 2;                             // true = 最终结果；false = 中间结果
    uint64 begin_time = 3;                         // 起始时间（ms，相对音频起点）
}

// ASR 错误（服务端 → 客户端）
message AsrError {
    string message = 1;
    int32 code = 2;
}

// ===== TTS =====

// TTS 会话开启请求（客户端 → 服务端）
message TtsOpenRequest {
    string model = 1;                              // 例如 "cosyvoice-v2"
    string voice = 2;                              // 音色 ID
    string format = 3;                             // 输出格式：pcm / wav / mp3 ...
    uint32 sample_rate = 4;                        // 输出采样率
    bool stream = 5;                               // 是否流式
}

// TTS 会话开启响应（服务端 → 客户端）
message TtsOpenResponse {
    string task_id = 1;
}

// TTS 文本请求（客户端 → 服务端），可发送多段
message TtsText {
    string text = 1;
}

// TTS 结束请求（客户端 → 服务端），指示服务端停止生成音频
message TtsStop {}

// TTS 音频分片（服务端 → 客户端），payload 携带音频字节
message TtsAudioChunk {
    bytes payload = 1;
}

// TTS 合成完成（服务端 → 客户端）
message TtsSynthesisDone {
    uint32 total_chunks = 1;
}

// TTS 错误（服务端 → 客户端）
message TtsError {
    string message = 1;
    int32 code = 2;
}
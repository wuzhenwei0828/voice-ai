[package]
name = "ws_payload_helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Generate msgpack hex/base64 of VoicePayload for Postman testing"

[[bin]]
name = "ws_payload_helper"
path = "src/main.rs"

[dependencies]
voice-proto = { workspace = true }
webproto = { workspace = true }
rmp-serde = "1.1"
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
base64 = "0.22"
[package]
name = "voice_server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Voice server using webhttp framework"

[dependencies]
voice-proto = { workspace = true }
webproto = { workspace = true }
webhttp = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
async-openai = { version = "=0.29.0", features = ["rustls"] }
async-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }
clap = { version = "4", features = ["derive"] }
uuid = { workspace = true }
prometheus = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dashmap = "6.0"
base64 = "0.22"
actix = "0.13"
actix-web = "4"
actix-files = "0.6"
redis = { workspace = true }

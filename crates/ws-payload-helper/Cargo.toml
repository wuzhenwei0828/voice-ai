[package]
name = "ws-payload-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "生成 VoicePayload 的 msgpack 十六进制，方便 Postman 测试"

[[bin]]
name = "ws-payload-helper"
path = "src/main.rs"

[dependencies]
voice-proto = { workspace = true }
webproto = { workspace = true }
rmp-serde = "1.1"
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
base64 = "0.22"
[workspace]
resolver = "2"
members = [
    "crates/voice-proto",
    "crates/voice_server",
    "crates/ws_payload_helper",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["wuzhenwei"]

[workspace.dependencies]
voice-proto = { path = "crates/voice-proto" }
webproto = "0.1.0"
webhttp = "0.1.12"
webclient = "0.1.1"
async-tungstenite = { version = "0.28", features = ["tokio-runtime", "tokio-rustls-webpki-roots"] }

tokio = { version = "1.33", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time", "json"] }
tracing-appender = "0.2"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
futures = "0.3"
futures-util = "0.3"
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
parking_lot = "0.12"
bytes = "1"
prost = "0.13"
prost-build = "0.13"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
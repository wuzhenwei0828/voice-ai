[workspace]
resolver = "2"
members = [
    "crates/voice-proto",
    "crates/voice-server",
    "crates/voice-vad",
    "crates/ws-payload-helper",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["wuzhenwei"]

[workspace.dependencies]
voice-proto = { path = "crates/voice-proto" }
webproto = { path = "/Users/wuzhenwei/Code/github/webproto" }
webhttp = { path = "/Users/wuzhenwei/Code/github/webhttp" }
webclient = { path = "/Users/wuzhenwei/Code/github/webclient" }

tokio = { version = "1.33", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time", "json"] }
tracing-appender = "0.2"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
futures = "0.3"
futures-util = "0.3"
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
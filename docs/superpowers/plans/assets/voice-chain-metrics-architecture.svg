<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Voice chain metrics architecture</title>
  <desc id="desc">Client audio and WebSocket messages flow through VoiceService and VoiceSession to ASR, LLM and TTS. Metrics are recorded at each timing point and exposed through a Prometheus endpoint.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 8; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .timing { stroke: #0f766e; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="48" y="48" class="label" font-size="24">Voice chain metrics: event and timing flow</text>
  <text x="48" y="76" class="small">Monotonic Instant timestamps are converted to seconds; trace/session/request IDs stay in logs, never in metric labels.</text>

  <!-- connectors first -->
  <path class="edge" d="M 190 210 L 285 210"/>
  <path class="edge" d="M 445 210 L 540 210"/>
  <path class="edge" d="M 700 210 L 795 210"/>
  <path class="edge" d="M 955 210 L 1050 210"/>
  <path class="edge" d="M 1125 270 L 1125 360"/>
  <path class="edge" d="M 1125 440 L 1125 530"/>
  <path class="timing" d="M 365 275 L 365 580 L 875 580 L 875 275"/>
  <path class="timing" d="M 620 275 L 620 620 L 875 620"/>
  <path class="timing" d="M 875 275 L 875 620"/>
  <path class="timing" d="M 1125 275 L 1125 620 L 1015 620"/>

  <!-- main flow -->
  <rect x="40" y="165" width="150" height="90" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="115" y="202" text-anchor="middle" class="label">客户端</text>
  <text x="115" y="228" text-anchor="middle" class="small">AudioChunk / WS</text>

  <rect x="285" y="165" width="160" height="90" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="365" y="202" text-anchor="middle" class="label">VoiceService</text>
  <text x="365" y="228" text-anchor="middle" class="small">decode + trace_id</text>

  <rect x="540" y="165" width="160" height="90" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="620" y="202" text-anchor="middle" class="label">VoiceSession</text>
  <text x="620" y="228" text-anchor="middle" class="small">input start/end</text>

  <rect x="795" y="165" width="160" height="90" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="875" y="202" text-anchor="middle" class="label">Pipeline</text>
  <text x="875" y="228" text-anchor="middle" class="small">ASR → LLM → TTS</text>

  <rect x="1050" y="165" width="150" height="90" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="1125" y="202" text-anchor="middle" class="label">客户端</text>
  <text x="1125" y="228" text-anchor="middle" class="small">TTS audio/playback</text>

  <!-- providers -->
  <rect x="1045" y="360" width="160" height="80" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1125" y="393" text-anchor="middle" class="label">Prometheus</text>
  <text x="1125" y="418" text-anchor="middle" class="small">/metrics/voice</text>

  <rect x="1045" y="530" width="160" height="80" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1125" y="563" text-anchor="middle" class="label">Dashboard</text>
  <text x="1125" y="588" text-anchor="middle" class="small">p50 / p95 / p99</text>

  <rect x="300" y="500" width="715" height="150" class="box" fill="#ffffff" stroke="#0f766e"/>
  <text x="330" y="535" class="label">VoiceMetricsSink</text>
  <text x="330" y="565" class="small">业务层只发事件和 duration，不依赖 Prometheus 类型</text>
  <text x="330" y="590" class="small">Prometheus adapter: E2E / stages / result counters</text>
  <text x="330" y="615" class="small">Noop adapter: tests or metrics disabled</text>

  <text x="210" y="575" class="small" fill="#0f766e">input_started_at</text>
  <text x="485" y="615" class="small" fill="#0f766e">input_ended_at</text>
  <text x="880" y="645" class="small" fill="#0f766e">first TTS audio / completion</text>
</svg>

# voice-server 配置
log:
  level: info
  file: ../logs/voice-server.log
  format: pretty

server:
  port: 8080
  worker_num: 3

# ASR：示例接 Whisper / 阿里云一句话识别
asr:
  kind: http
  endpoint: "https://api.siliconflow.cn/v1/audio/transcriptions"   # base URL；path 会拼在后面
  path: /v1/audio/transcriptions                   # 默认 /recognize；空字符串 = endpoint 是完整 URL
  method: POST                        # POST / GET / PUT
  model: FunAudioLLM/SenseVoiceSmall                    # 会作为 X-Model header + body 字段发出
  authorization: "Bearer sk-eqrxgvnikhfvdyopwwjysszlsbqljintrgfacxdhpghsctri"                   # Bearer sk-xxx；非空时作为 Authorization header
  headers:                            # 自定义 header（厂商特有字段）
    X-Region: cn-beijing
  timeout_ms: 30000

# LLM：示例接 OpenAI / 通义千问 / DeepSeek
llm:
  kind: http
  endpoint: "https://api.siliconflow.cn/v1"
  path: /chat/completions             # 默认 /chat
  method: POST
  model: deepseek-ai/DeepSeek-V4-Flash
  authorization: "Bearer sk-eqrxgvnikhfvdyopwwjysszlsbqljintrgfacxdhpghsctri"
  headers: {}
  timeout_ms: 30000

# TTS：示例接 OpenAI / CosyVoice / 硅基流动
tts:
  kind: http
  endpoint: "https://api.siliconflow.cn/v1"
  path: /audio/speech                 # 默认 /synthesize
  method: POST
  model: fnlp/MOSS-TTSD-v0.5
  voice: fnlp/MOSS-TTSD-v0.5:alex                        # OpenAI: alloy/echo/fable/onyx/nova/shimmer；CosyVoice: zhitian_emo
  response_format: wav                # OpenAI: mp3/opus/aac/flac/wav/pcm
  authorization: "Bearer sk-eqrxgvnikhfvdyopwwjysszlsbqljintrgfacxdhpghsctri"
  headers: {}
  timeout_ms: 30000